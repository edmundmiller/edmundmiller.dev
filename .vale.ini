StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/edmundmiller/WriteSimply/releases/download/v1.0.0/WriteSimply.zip

IgnoredScopes = code, tt, img, url, a
SkippedScopes = script, style, pre, figure, code

# Git-pinned LLMCliches and ClearTechnical are installed by
# scripts/sync_vale_styles.sh. `vale sync` only materializes Packages (WriteSimply).
# Run the sync script after clone and in CI; do not vendor those style trees.

[*.{md,mdx}]
BasedOnStyles = WriteSimply, LLMCliches, STE, STEDescriptive

# Site-reasonable noise controls. LLMCliches.ChatbotArtifacts flags raw
# `utm_source=` strings, which this site uses when discussing analytics.
LLMCliches.ChatbotArtifacts = NO

# STE / STEDescriptive are aerospace-manual strict. Keep vocabulary, article,
# tense, and pronoun lists off on a personal blog; leave the descriptive
# structure checks that survive a first local sync. Unknown names are listed
# only after the private package is present — cloud/CI uses SKIP stubs, so
# these overrides apply when ClearTechnical is actually installed.
STE.ApprovedWords = NO
STE.Dictionary = NO
STE.WordList = NO
STE.Articles = NO
STE.Pronouns = NO
STE.Verbs = NO
STE.Tense = NO
STE.Contractions = NO
STE.Spelling = NO
STEDescriptive.ApprovedWords = NO
STEDescriptive.Dictionary = NO
STEDescriptive.WordList = NO
